name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  # One run per branch: a new push cancels the previous, still-running build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail the build on any compiler warning.
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.toolchain == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: [stable]
        include:
          # Minimum supported version, pinned by `rust-version` in Cargo.toml.
          # One target only, so a bump shows up without tripling CI time.
          - os: ubuntu-latest
            toolchain: "1.82"
          # Early warning for upstream breakage; never blocks a merge.
          - os: ubuntu-latest
            toolchain: beta
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}

      - name: Build
        run: cargo build --all-targets --verbose

      # The test suite is arithmetic-heavy (200k truncated Laplace samples, several
      # structure builds), so it runs in release: a debug run is minutes slower for
      # no extra coverage.
      - name: Test
        run: cargo test --release --all-targets --verbose

      - name: Doc tests
        run: cargo test --release --doc --verbose

  # Clippy runs in its own workflow (clippy.yml) so that it has its own badge.
  lint:
    name: rustfmt + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Documentation builds without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Unit, integration and binary tests, in release like the `test` job. Doc
      # tests need a nightly toolchain to be instrumented, so they are left out.
      - name: Tests
        run: cargo llvm-cov --no-report --release --all-targets

      # The experiment binaries have no unit tests of their own: run each one at a
      # tiny size, with every algorithm and the main options, so they count too.
      - name: Experiments
        run: |
          run() { cargo llvm-cov run --no-report --release --bin "$@"; }
          run ann_experiment -- --help
          run dp_annc_experiment -- --help
          run generate_data -- --help
          for algorithm in tensor-close-top1 tensor-top1 close-top1 top1; do
            run ann_experiment -- --algorithm $algorithm --n 2000 --d 32 --trials 20 \
              --m-sub 256 --seed 1
            run dp_annc_experiment -- --algorithm $algorithm --n 2000 --d 32 --queries 5 \
              --neighbours 200 --epsilons 1,8 --repeat 2 --m-sub 256 --seed 1
          done
          run ann_experiment -- --n 2000 --d 32 --trials 20 --strict --repeat 2 --seed 1
          run generate_data -- --n 2000 --d 32 --queries 5 --out data/coverage.bin
          run ann_experiment -- --data data/coverage.bin --no-linear
          run dp_annc_experiment -- --data data/coverage.bin --epsilons 1 --repeat 1

      - name: Coverage report
        run: cargo llvm-cov report --release --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  smoke:
    name: experiments run end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Tiny parameters: this checks the binaries still run and agree with their
      # own ground truth, not that the published numbers reproduce (those need
      # n = 10^6 and are documented in the README instead).
      - name: ANN success rate
        run: cargo run --release --bin ann_experiment -- --n 2000 --d 32 --trials 20 --seed 1

      - name: DP-ANNC error
        run: >
          cargo run --release --bin dp_annc_experiment --
          --n 2000 --d 32 --queries 5 --neighbours 200 --epsilons 1,8 --repeat 2 --seed 1

      - name: The other three algorithms
        run: |
          for algorithm in tensor-top1 close-top1 top1; do
            cargo run --release --bin ann_experiment -- --algorithm $algorithm \
              --n 2000 --d 32 --trials 20 --m-sub 256 --seed 1
            cargo run --release --bin dp_annc_experiment -- --algorithm $algorithm \
              --n 2000 --d 32 --queries 5 --neighbours 200 --epsilons 1,8 --repeat 2 \
              --m-sub 256 --seed 1
          done

      - name: Data generation round trip
        run: |
          cargo run --release --bin generate_data -- --n 2000 --d 32 --queries 5 --out data/ci.bin
          cargo run --release --bin ann_experiment -- --data data/ci.bin --no-linear

  readmes:
    # Each algorithm's README.md is generated from the rustdoc of its type. Pull
    # requests are checked by the `algorithm_readmes` test in the `test` job; on
    # master this job regenerates the READMEs and commits them if they changed.
    name: regenerate algorithm READMEs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Regenerate from the rustdoc
        run: UPDATE_READMES=1 cargo test --test algorithm_readmes

      - name: Commit the READMEs if they changed
        run: |
          if [ -n "$(git status --porcelain -- 'src/*README.md')" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- 'src/*README.md'
            git commit -m "docs: regenerate algorithm READMEs from rustdoc"
            git push
          fi
