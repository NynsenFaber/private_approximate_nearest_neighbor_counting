[package]
name = "ann_rust"
version = "3.0.0"
authors = ["Fabrizio Boninsegna"]
edition = "2021"
# `Option::is_none_or` (lsf/filters.rs) and `io::Error::other` (data.rs).
rust-version = "1.82"
description = "Locality sensitive filters for approximate near neighbour search and differentially private approximate near neighbour counting (Aumüller, Boninsegna, Silvestri, FORC 2025)"

# The experiments live in `experiments/`, next to the library, not in `src/bin/`.
[[bin]]
name = "ann_experiment"
path = "experiments/ann_experiment.rs"

[[bin]]
name = "dp_annc_experiment"
path = "experiments/dp_annc_experiment.rs"

[[bin]]
name = "generate_data"
path = "experiments/generate_data.rs"

[dependencies]
rand_distr = "0.4.3"
rand = "0.8.6"
savefile = "0.18"
savefile-derive = "0.18"
rayon = "1.10.0"
